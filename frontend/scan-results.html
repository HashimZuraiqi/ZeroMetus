<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Results - ZeroMetus</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">
    <!-- Sidebar (same structure) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="sidebar-logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
                <span>ZeroMetus</span>
            </a>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <span class="nav-section-title">Main</span>
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </div>

            <div class="nav-section">
                <span class="nav-section-title">Projects</span>
                <div class="nav-projects" id="nav-projects"></div>
            </div>
        </nav>

        <div class="sidebar-footer">
            <a href="settings.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>Settings</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>

            <div class="breadcrumb">
                <a href="dashboard.html">Dashboard</a>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
                <a href="#" id="breadcrumb-project-link">Project</a>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
                <span>Scan Results</span>
            </div>

            <div class="topbar-actions">
                <div class="user-menu" id="user-menu">
                    <button class="user-menu-btn">
                        <div class="user-avatar" id="user-avatar">JD</div>
                    </button>
                </div>
            </div>
        </header>

        <!-- Scan Results Content -->
        <div class="dashboard-content">
            <!-- Scan Summary Header -->
            <section class="scan-summary-header">
                <div class="scan-info">
                    <h1>Scan Results</h1>
                    <div class="scan-meta">
                        <span id="scan-date">January 1, 2026</span>
                        <span class="separator">•</span>
                        <span id="scan-duration">Completed in 3.2s</span>
                        <span class="separator">•</span>
                        <span id="scan-files">47 files analyzed</span>
                    </div>
                </div>
                <div class="scan-actions">
                    <button class="btn btn-secondary" id="export-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Export Report
                    </button>
                    <button class="btn btn-primary" id="rescan-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                        Rescan
                    </button>
                </div>
            </section>

            <!-- Severity Summary Bar -->
            <section class="severity-summary">
                <div class="severity-cards">
                    <div class="severity-card critical" id="filter-critical">
                        <div class="severity-count" id="count-critical">0</div>
                        <div class="severity-label">Critical</div>
                    </div>
                    <div class="severity-card high" id="filter-high">
                        <div class="severity-count" id="count-high">0</div>
                        <div class="severity-label">High</div>
                    </div>
                    <div class="severity-card medium" id="filter-medium">
                        <div class="severity-count" id="count-medium">0</div>
                        <div class="severity-label">Medium</div>
                    </div>
                    <div class="severity-card low" id="filter-low">
                        <div class="severity-count" id="count-low">0</div>
                        <div class="severity-label">Low</div>
                    </div>
                </div>
            </section>

            <!-- Filters and Sort -->
            <section class="findings-controls">
                <div class="filter-group">
                    <label>Filter by:</label>
                    <div class="filter-chips">
                        <button class="filter-chip active" data-filter="all">All</button>
                        <button class="filter-chip" data-filter="critical">Critical</button>
                        <button class="filter-chip" data-filter="high">High</button>
                        <button class="filter-chip" data-filter="medium">Medium</button>
                        <button class="filter-chip" data-filter="low">Low</button>
                    </div>
                </div>
                <div class="sort-group">
                    <label for="sort-by">Sort by:</label>
                    <select id="sort-by">
                        <option value="severity">Severity (High to Low)</option>
                        <option value="file">File Name</option>
                        <option value="type">Vulnerability Type</option>
                    </select>
                </div>
            </section>

            <!-- Findings List -->
            <section class="findings-list" id="findings-list">
                <!-- Findings loaded dynamically -->
            </section>

            <!-- Empty State -->
            <section class="empty-state hidden" id="no-findings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <h3>No vulnerabilities found!</h3>
                <p>Great work! Your code passed all security checks.</p>
            </section>

            <!-- Bulk Actions Bar (shown when items selected) -->
            <div class="bulk-actions-bar hidden" id="bulk-actions">
                <span class="selected-count"><span id="selected-count">0</span> selected</span>
                <div class="bulk-buttons">
                    <button class="btn btn-sm btn-secondary" id="bulk-acknowledge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        Acknowledge
                    </button>
                    <button class="btn btn-sm btn-secondary" id="bulk-export">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Export Selected
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/scan-results.js"></script>
</body>
</html>
